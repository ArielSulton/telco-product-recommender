# Prometheus Configuration for Telco Recommender System
# =======================================================
#
# Scrape configurations for all services with custom metrics
# and alert rules for production monitoring.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'telco-recommender'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Rule files
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # FastAPI Backend
  - job_name: 'fastapi-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics/'
    scrape_interval: 10s
    metric_relabel_configs:
      # Keep only recommendation-related metrics
      - source_labels: [__name__]
        regex: '(recommendation_.*|http_.*|process_.*)'
        action: keep



  # Airflow Scheduler
  - job_name: 'airflow'
    static_configs:
      - targets: ['statsd-exporter:9102']
    scrape_interval: 30s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
