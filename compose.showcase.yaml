name: telco-recommender-showcase

# Minimal production stack for showcase/demo purposes on resource-constrained VPS.
# Only postgres + redis + backend + frontend. No airflow, mlflow, prometheus,
# grafana, data-simulator, or ml/jupyter.
#
# Consequence: ML models are not loaded from MLflow (no mlflow service here),
# so the backend automatically falls back to TopPopularBaseline recommendations
# instead of the full K-Means + LightFM + XGBoost hybrid pipeline. This is
# graceful (see backend/app/main.py lifespan) — it will not crash the app.
# GET /health/ready will report "mlflow": "unhealthy" — that's expected/cosmetic.

services:
  # PostgreSQL Database (reduced resources for showcase scale)
  telco-postgres:
    image: postgres:14-alpine
    container_name: telco-postgres-showcase
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c effective_cache_size=384MB
      -c maintenance_work_mem=32MB
      -c work_mem=2621kB

  # Redis Cache (small footprint, backs recommendation cache + rate limiting)
  telco-redis:
    image: redis:7-alpine
    container_name: telco-redis-showcase
    env_file:
      - .env
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Backend API
  backend:
    build:
      context: ./backend
      target: production
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - VCS_REF=${VCS_REF:-$(git rev-parse --short HEAD)}
        - VERSION=${VERSION:-1.0.0}
    container_name: telco-backend-showcase
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - NODE_ENV=production
      - API_V1_STR=${API_V1_STR}
      - API_WORKERS=2
      - API_RELOAD=false
      - PROJECT_NAME=${PROJECT_NAME}
      - VERSION=${VERSION}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_HOST=telco-postgres
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=telco-redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # No mlflow service in this stack; readiness check will show this
      # dependency as unhealthy, which is expected and non-fatal.
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      telco-postgres:
        condition: service_healthy
      telco-redis:
        condition: service_healthy
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 384M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paketify-backend.rule=Host(`${FRONTEND_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.paketify-backend.entrypoints=websecure"
      - "traefik.http.routers.paketify-backend.tls.certResolver=letsencrypt"
      - "traefik.http.routers.paketify-backend.priority=100"
      - "traefik.http.routers.paketify-backend.service=paketify-backend"
      - "traefik.http.services.paketify-backend.loadbalancer.server.port=8000"
      - "traefik.docker.network=dokploy-network"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: telco-frontend-showcase
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - backend
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paketify-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.paketify-frontend.entrypoints=websecure"
      - "traefik.http.routers.paketify-frontend.tls.certResolver=letsencrypt"
      - "traefik.http.routers.paketify-frontend.priority=50"
      - "traefik.http.routers.paketify-frontend.service=paketify-frontend"
      - "traefik.http.services.paketify-frontend.loadbalancer.server.port=5173"
      - "traefik.docker.network=dokploy-network"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
